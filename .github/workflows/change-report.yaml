name: Change Report

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine base commit
        id: base
        run: |
          if [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            echo "base=${{ github.event.before }}" >> $GITHUB_OUTPUT
          else
            echo "base=$(git rev-list --max-parents=0 HEAD)" >> $GITHUB_OUTPUT
          fi

      - name: Generate report (HTML + JSON)
        run: |
          mkdir -p report
          {
            echo "<!doctype html><html><head><meta charset='utf-8'><title>MagecoShipping — Change Report</title>"
            echo "<style>body{font-family:system-ui,Segoe UI,Roboto,Arial;margin:24px}h1{margin:0 0 8px}small{color:#666}"
            echo "pre{background:#f6f8fa;padding:12px;overflow:auto}table{border-collapse:collapse;margin:12px 0;width:100%}"
            echo "th,td{border:1px solid #ddd;padding:8px;text-align:left}code{font-family:ui-monospace,Consolas,monaco,monospace}</style></head><body>"
            echo "<h1>MagecoShipping — Change Report</h1>"
            echo "<small>Branch: <code>${GITHUB_REF_NAME}</code> • Commit: <code>${GITHUB_SHA}</code> • Base: <code>${{ steps.base.outputs.base }}</code></small>"
            echo "<h2>File cambiati</h2>"
            git diff --name-status ${{ steps.base.outputs.base }} $GITHUB_SHA | \
              awk 'BEGIN{print "<table><tr><th>Stato</th><th>File</th></tr>"} {printf("<tr><td>%s</td><td><code>%s</code></td></tr>\n",$1,$2)} END{print "</table>"}'
            echo "<h2>Statistiche</h2><pre>"
            git diff --shortstat ${{ steps.base.outputs.base }} $GITHUB_SHA
            echo "</pre><h2>Ultimo commit</h2><pre>"
            git --no-pager log -1 --pretty=fuller
            echo "</pre></body></html>"
          } > report/index.html

          # JSON per integrazioni future
          git diff --name-status ${{ steps.base.outputs.base }} $GITHUB_SHA | \
            awk 'BEGIN{print "["} {printf("%s{\"status\":\"%s\",\"path\":\"%s\"}", (NR>1?",":""), $1, $2)} END{print "]"}' \
            > report/changes.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: report

  deploy:
    needs: build-report
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
