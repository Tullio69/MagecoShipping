name: Change Report

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine base & head
        id: base
        shell: bash
        run: |
          set -euo pipefail
          # BASE: commit precedente al push, se esiste; altrimenti primo commit della repo
          if [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            BASE="${{ github.event.before }}"
          else
            BASE="$(git rev-list --max-parents=0 HEAD)"
          fi
          echo "base=$BASE" >> $GITHUB_OUTPUT
          echo "🔎 BASE: $BASE"
          echo "🔎 HEAD: $GITHUB_SHA"

      - name: Prepare ignore regex (optional)
        id: ign
        shell: bash
        run: |
          set -euo pipefail
          if [ -f .diffignore ]; then
            echo "Found .diffignore:"
            cat .diffignore || true
            # Costruisci una regex "a|b|c" ignorando righe vuote e commenti
            REGEX="$(grep -vE '^\s*($|#)' .diffignore | sed 's/[.[\*^$()+?{}|]/\\&/g' | paste -sd'|' - || true)"
            echo "regex=$REGEX" >> $GITHUB_OUTPUT
            echo "Built ignore regex: ${REGEX:-<empty>}"
          else
            echo "No .diffignore file"
            echo "regex=" >> $GITHUB_OUTPUT
          fi

      - name: Generate report (HTML + JSON)
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ steps.base.outputs.base }}"
          HEAD="$GITHUB_SHA"
          IGNREGEX="${{ steps.ign.outputs.regex }}"

          mkdir -p report

          # Helper: stampa la tabella file cambiati (filtrata)
          list_changes() {
            if [ -n "$IGNREGEX" ]; then
              git diff --name-status "$BASE" "$HEAD" | grep -Ev "$IGNREGEX" || true
            else
              git diff --name-status "$BASE" "$HEAD" || true
            fi
          }

          # Helper: numstat aggregato filtrato (più robusto di shortstat)
          make_shortstat() {
            if [ -n "$IGNREGEX" ]; then
              SRC="$(git diff --numstat "$BASE" "$HEAD" | awk 'NF>=3 {print $1 "\t" $2 "\t" substr($0, index($0,$3))}')" || true
              # Filtra sul terzo campo (path)
              SRC="$(printf "%s\n" "$SRC" | awk -v IGN="$IGNREGEX" '
                BEGIN{IGNORECASE=0}
                {
                  a=$1; b=$2; path=substr($0, index($0,$3));
                  if (path ~ IGN) next;
                  print $0
                }'
              )" || true
            else
              SRC="$(git diff --numstat "$BASE" "$HEAD" | awk 'NF>=3 {print $1 "\t" $2 "\t" substr($0, index($0,$3))}')" || true
            fi

            if [ -z "$SRC" ]; then
              echo "0 files changed, 0 insertions(+), 0 deletions(-)"
              return
            fi

            # Somma a mano gestendo i '-' dei binari (trattali come 0)
            echo "$SRC" | awk '
              {
                add=$1; del=$2;
                if(add=="-") add=0; if(del=="-") del=0;
                A+=add; D+=del; F+=1
              }
              END{ printf("%d files changed, %d insertions(+), %d deletions(-)\n", F, A, D) }'
          }

          # ---- HTML ----
          {
            echo "<!doctype html><html><head><meta charset='utf-8'><title>MagecoShipping — Change Report</title>"
            echo "<style>body{font-family:system-ui,Segoe UI,Roboto,Arial;margin:24px}h1{margin:0 0 8px}small{color:#666}"
            echo "pre{background:#f6f8fa;padding:12px;overflow:auto}table{border-collapse:collapse;margin:12px 0;width:100%}"
            echo "th,td{border:1px solid #ddd;padding:8px;text-align:left}code{font-family:ui-monospace,Consolas,monaco,monospace}</style></head><body>"
            echo "<h1>MagecoShipping — Change Report</h1>"
            echo "<small>Branch: <code>${GITHUB_REF_NAME}</code> • Commit: <code>${GITHUB_SHA}</code> • Base: <code>${BASE}</code></small>"

            echo "<h2>File cambiati</h2>"
            CHANGES="$(list_changes)"
            if [ -z "$CHANGES" ]; then
              echo "<p>Nessuna modifica rilevata.</p>"
            else
              echo "<table><tr><th>Stato</th><th>File</th></tr>"
              # Escape HTML minimale per i path
              printf "%s\n" "$CHANGES" | awk '{
                status=$1; $1="";
                path=substr($0,2);
                gsub("&","&amp;",path); gsub("<","&lt;",path); gsub(">","&gt;",path);
                printf("<tr><td>%s</td><td><code>%s</code></td></tr>\n", status, path)
              }'
              echo "</table>"
            fi

            echo "<h2>Statistiche</h2><pre>"
            make_shortstat
            echo "</pre>"

            echo "<h2>Ultimo commit</h2><pre>"
            git --no-pager log -1 --pretty=fuller
            echo "</pre>"

            if [ -n "$IGNREGEX" ]; then
              echo "<h2>.diffignore</h2><pre>$(printf "%s" "$IGNREGEX")</pre>"
            fi

            echo "</body></html>"
          } > report/index.html

          # ---- JSON (stessa lista cambi filtrata) ----
          if [ -z "$CHANGES" ]; then
            echo "[]" > report/changes.json
          else
            printf "%s\n" "$CHANGES" | awk '
              BEGIN{print "["}
              {
                status=$1; $1=""; path=substr($0,2);
                gsub(/"/,"\\\"",path);
                printf("%s{\"status\":\"%s\",\"path\":\"%s\"}", (NR>1?",":""), status, path)
              }
              END{print "]"}' > report/changes.json
          fi

      - name: Upload report as artifact (all branches)
        uses: actions/upload-artifact@v4
        with:
          name: change-report-${{ github.ref_name }}
          path: report

  deploy:
    if: github.ref_name == 'main'
    needs: build-report
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download built report
        uses: actions/download-artifact@v4
        with:
          name: change-report-main
          path: report

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: report

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
