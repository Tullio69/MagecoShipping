<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>Revisione dati fattura</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="container">
    <h2>Rivedi i dati prima del salvataggio</h2>
    <form method="post">
      {% for key, value in data.items() if key != 'original_path' %}
        <div class="form-row">
          <label>{{ key }}</label>
          <input type="text" name="{{ key }}" value="{{ value }}">
        </div>
      {% endfor %}
      <div class="buttons">
        <button type="submit" name="action" value="confirm">✅ Convalida</button>
        <button type="submit" name="action" value="correct">✏️ Correggi e convalida</button>
        <button type="submit" name="action" value="reject">❌ Rifiuta</button>
      </div>
    </form>
  </div>
</body>
</html>
